<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas Keluarga</title>
<style>
  :root{
    --ink: #1c2b33;
    --ink-soft: #3d5560;
    --paper: #fbf8f2;
    --paper-line: #e3ddcd;
    --gold: #b8863b;
    --gold-deep: #8f6526;
    --income: #4c7a5c;
    --income-bg: #e7efe6;
    --expense: #a34a3d;
    --expense-bg: #f3e6e2;
    --muted: #8a8378;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,134,59,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(184,134,59,0.06), transparent 40%);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
    min-height:100vh;
    padding: 28px 14px 60px;
  }
  .sheet{
    max-width: 620px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
  }

  /* ---- Layout besar (laptop/desktop): dua kolom, form+ringkasan di kiri, catatan di kanan ---- */
  @media (min-width: 860px){
    body{ padding: 48px 24px 60px; }
    .sheet{
      max-width: 1080px;
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-areas:
        "head   head"
        "tabs   tabs"
        "summary summary"
        "form   list"
        "aside  list";
      align-items: start;
    }
    .sheet::before{ height: 100%; }
    header{ grid-area: head; }
    .tabs{ grid-area: tabs; }
    .summary{ grid-area: summary; margin: 20px 24px 0 62px; grid-template-columns: repeat(3, 1fr); }
    form.entry{ grid-area: form; margin: 20px 20px 0 62px; position: sticky; top: 24px; }
    .cat-breakdown{ grid-area: aside; margin: 20px 20px 0 62px; }
    .list{ grid-area: list; margin: 20px 30px 30px 24px; max-height: 680px; overflow-y: auto; padding-right: 6px; }
    .footer-note{ grid-column: 1 / -1; margin: 8px 30px 24px 62px !important; }
  }
  .sheet::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width: 46px;
    background: repeating-linear-gradient(
      to bottom, transparent 0 22px, var(--paper-line) 22px 23px
    );
    opacity: 0.5;
  }
  header{
    padding: 30px 30px 22px 62px;
    border-bottom: 1px solid var(--paper-line);
  }
  header h1{
    margin:0;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--ink);
  }
  header p{
    margin: 6px 0 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--muted);
  }

  .tabs{
    display:flex;
    gap: 4px;
    padding: 16px 30px 0 62px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .tab{
    padding: 11px 14px;
    min-height: 40px;
    display:flex;
    align-items:center;
    font-size: 13.5px;
    color: var(--ink-soft);
    border: 1px solid transparent;
    border-bottom: none;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active{
    background: #fff;
    border-color: var(--paper-line);
    color: var(--ink);
    font-weight: 600;
  }

  .summary{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--paper-line);
    margin: 0 30px 0 62px;
    border: 1px solid var(--paper-line);
  }
  .summary .cell{
    background:#fff;
    padding: 16px 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .summary .cell .lbl{ font-size: 11.5px; color: var(--muted); }
  .summary .cell .val{
    font-family: 'Courier New', monospace;
    font-size: 17px;
    font-weight: 700;
    margin-top: 4px;
    letter-spacing: -0.3px;
  }
  .summary .in .val{ color: var(--income); }
  .summary .out .val{ color: var(--expense); }
  .summary .bal .val{ color: var(--ink); }

  form.entry{
    margin: 22px 30px 0 62px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .seg{
    display:flex;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    overflow:hidden;
    margin-bottom: 12px;
  }
  .seg button{
    flex:1;
    padding: 12px 0;
    min-height: 44px;
    border:none;
    background:#fff;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor:pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button.on.income{ background: var(--income-bg); color: var(--income); }
  .seg button.on.expense{ background: var(--expense-bg); color: var(--expense); }

  .row2{ display:flex; gap:10px; margin-bottom:10px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size: 11.5px; color: var(--muted); }
  .field input, .field select{
    padding: 10px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 5px;
    font-size: 16px;
    font-family: inherit;
    background: #fffefb;
    color: var(--ink);
    min-height: 42px;
  }
  .field input:focus, .field select:focus{ outline: 1.5px solid var(--gold); }

  .submit-btn{
    width:100%;
    padding: 13px 0;
    min-height: 46px;
    margin-top: 4px;
    border:none;
    border-radius: 6px;
    background: var(--ink);
    color: #fbf8f2;
    font-size: 15px;
    font-weight: 600;
    cursor:pointer;
    letter-spacing:0.2px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .submit-btn:active{ transform: translateY(1px); }

  .list{
    margin: 24px 30px 30px 62px;
  }
  .day-group{ margin-bottom: 18px; }
  .day-head{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11.5px;
    color: var(--gold-deep);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--paper-line);
    margin-bottom: 6px;
    display:flex;
    justify-content:space-between;
  }
  .entry-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--paper-line);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .entry-row .left{ display:flex; flex-direction:column; gap:2px; }
  .entry-row .cat{ font-size: 14px; color: var(--ink); font-weight: 600; }
  .entry-row .note{ font-size: 12px; color: var(--muted); }
  .entry-row .right{ display:flex; align-items:center; gap:10px; }
  .entry-row .amt{ font-family: 'Courier New', monospace; font-size: 14.5px; font-weight:700; }
  .entry-row .amt.income{ color: var(--income); }
  .entry-row .amt.expense{ color: var(--expense); }
  .del-btn{
    border:none; background:none; color: var(--muted); cursor:pointer;
    font-size: 17px; line-height:1; padding: 10px 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .del-btn:hover{ color: var(--expense); }

  .hist-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 13px 4px;
    border-bottom: 1px solid var(--paper-line);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    cursor: pointer;
  }
  .hist-row:hover{ background: rgba(184,134,59,0.06); }
  .hist-row .hm{ font-size: 14.5px; font-weight: 700; color: var(--ink); text-transform: capitalize; }
  .hist-row .hcount{ font-size: 11.5px; color: var(--muted); margin-top:2px; }
  .hist-row .hvals{ text-align:right; font-family:'Courier New', monospace; font-size: 13px; }
  .hist-row .hvals .hin{ color: var(--income); }
  .hist-row .hvals .hout{ color: var(--expense); }
  .hist-row .hvals .hbal{ color: var(--ink); font-weight:700; margin-top:2px; }

  .empty{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--muted); font-size: 13.5px;
    text-align:center; padding: 30px 10px;
  }

  .cat-breakdown{
    margin: 0 30px 30px 62px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .cat-breakdown h3{
    font-size: 12px; text-transform:uppercase; letter-spacing:0.6px;
    color: var(--muted); margin: 0 0 10px;
  }
  .bar-row{ margin-bottom: 9px; }
  .bar-row .bar-label{
    display:flex; justify-content:space-between;
    font-size: 12.5px; color: var(--ink-soft); margin-bottom: 3px;
  }
  .bar-track{ height:6px; background: var(--paper-line); border-radius: 3px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--gold); border-radius:3px; }

  .footer-note{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px; color: rgba(251,248,242,0.45);
    text-align:center; margin-top: 16px;
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <h1 id="titleText">Buku Kas Keluarga</h1>
    <p id="dateText"></p>
  </header>

  <div class="tabs">
    <div class="tab active" data-period="day">Hari Ini</div>
    <div class="tab" data-period="month">Bulan Ini</div>
    <div class="tab" data-period="all">Semua</div>
    <div class="tab" data-period="history">Riwayat</div>
  </div>
  <div id="monthPicker" style="display:none; padding: 10px 30px 0 62px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <input type="month" id="monthSelect" style="padding:8px 10px; border:1px solid var(--paper-line); border-radius:5px; font-size:14px; font-family:inherit; background:#fffefb; color:var(--ink);">
  </div>

  <div class="summary">
    <div class="cell in"><div class="lbl">Pemasukan</div><div class="val" id="sumIn">Rp 0</div></div>
    <div class="cell out"><div class="lbl">Pengeluaran</div><div class="val" id="sumOut">Rp 0</div></div>
    <div class="cell bal"><div class="lbl">Saldo</div><div class="val" id="sumBal">Rp 0</div></div>
  </div>

  <form class="entry" id="entryForm">
    <div class="seg">
      <button type="button" class="on income" data-type="income" id="btnIncome">Pemasukan</button>
      <button type="button" class="expense" data-type="expense" id="btnExpense">Pengeluaran</button>
    </div>
    <div class="row2">
      <div class="field">
        <label>Jumlah (Rp)</label>
        <input type="number" id="amount" inputmode="numeric" placeholder="0" required min="0" step="1">
      </div>
      <div class="field">
        <label>Tanggal</label>
        <input type="date" id="date" required>
      </div>
    </div>
    <div class="row2">
      <div class="field" style="flex:1.3">
        <label>Kategori</label>
        <select id="category"></select>
      </div>
      <div class="field" style="flex:1.7">
        <label>Catatan (opsional)</label>
        <input type="text" id="note" placeholder="mis. beli beras">
      </div>
    </div>
    <button type="submit" class="submit-btn">Catat</button>
  </form>

  <div class="cat-breakdown" id="breakdownWrap" style="display:none">
    <h3>Rincian Pengeluaran per Kategori</h3>
    <div id="breakdown"></div>
  </div>

  <div class="list" id="listWrap">
    <div class="empty">Memuat catatan...</div>
  </div>

  <div class="list" id="historyWrap" style="display:none;"></div>

  <div class="footer-note" style="margin: -20px 30px 24px 62px; text-align:left; color: var(--muted);">
    Data tersimpan otomatis dan dibagikan ke siapa pun yang membuka tautan ini.
  </div>
</div>

<script>
const CATEGORIES = {
  income: ["Gaji", "Bonus", "Usaha", "Hasil Jual", "Lainnya"],
  expense: ["Makan", "Transportasi", "Belanja", "Tagihan", "Kesehatan", "Pendidikan", "Hiburan", "Lainnya"]
};

let currentType = "expense";
let currentPeriod = "day";
let entries = [];

const rupiah = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const todayStr = () => new Date().toISOString().slice(0,10);

function setTitleDate(){
  const d = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('dateText').textContent = d.toLocaleDateString('id-ID', opts);
  document.getElementById('date').value = todayStr();
  document.getElementById('monthSelect').value = todayStr().slice(0,7);
}

function populateCategories(){
  const sel = document.getElementById('category');
  sel.innerHTML = "";
  CATEGORIES[currentType].forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function setType(type){
  currentType = type;
  document.getElementById('btnIncome').classList.toggle('on', type==='income');
  document.getElementById('btnExpense').classList.toggle('on', type==='expense');
  populateCategories();
}

document.getElementById('btnIncome').addEventListener('click', ()=>setType('income'));
document.getElementById('btnExpense').addEventListener('click', ()=>setType('expense'));

let selectedMonth = todayStr().slice(0,7); // YYYY-MM

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentPeriod = t.dataset.period;
    document.getElementById('monthPicker').style.display = (currentPeriod === 'month') ? 'block' : 'none';
    document.getElementById('listWrap').style.display = (currentPeriod === 'history') ? 'none' : 'block';
    document.getElementById('breakdownWrap').style.display = (currentPeriod === 'history') ? 'none' : document.getElementById('breakdownWrap').dataset.hasData === '1' ? 'block' : 'none';
    document.getElementById('historyWrap').style.display = (currentPeriod === 'history') ? 'block' : 'none';
    document.querySelector('.summary').style.display = (currentPeriod === 'history') ? 'none' : 'grid';
    render();
  });
});

document.getElementById('monthSelect').addEventListener('change', (e)=>{
  selectedMonth = e.target.value || todayStr().slice(0,7);
  render();
});

async function loadEntries(){
  try{
    const res = await window.storage.get('entries', true);
    entries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
}

async function saveEntries(){
  try{
    await window.storage.set('entries', JSON.stringify(entries), true);
  }catch(e){
    console.error('Gagal menyimpan', e);
  }
}

function filterByPeriod(list){
  const today = todayStr();
  if(currentPeriod === 'day') return list.filter(e => e.date === today);
  if(currentPeriod === 'month') return list.filter(e => e.date.slice(0,7) === selectedMonth);
  return list; // 'all' dan 'history' pakai seluruh data
}

function render(){
  if(currentPeriod === 'history'){
    renderHistory();
    return;
  }

  const filtered = filterByPeriod(entries).slice().sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  let totalIn = 0, totalOut = 0;
  filtered.forEach(e=>{
    if(e.type === 'income') totalIn += e.amount; else totalOut += e.amount;
  });
  document.getElementById('sumIn').textContent = rupiah(totalIn);
  document.getElementById('sumOut').textContent = rupiah(totalOut);
  document.getElementById('sumBal').textContent = rupiah(totalIn - totalOut);

  const listWrap = document.getElementById('listWrap');
  listWrap.innerHTML = "";

  if(filtered.length === 0){
    listWrap.innerHTML = '<div class="empty">Belum ada catatan untuk periode ini. Mulai catat di atas.</div>';
  } else {
    const groups = {};
    filtered.forEach(e=>{
      if(!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });
    Object.keys(groups).sort().reverse().forEach(date=>{
      const dayEntries = groups[date];
      const dayIn = dayEntries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
      const dayOut = dayEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
      const groupDiv = document.createElement('div');
      groupDiv.className = 'day-group';
      const dLabel = new Date(date+'T00:00:00').toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'});
      groupDiv.innerHTML = `<div class="day-head"><span>${dLabel}</span><span>${dayIn>0? '+'+rupiah(dayIn)+' ':''}${dayOut>0? '-'+rupiah(dayOut):''}</span></div>`;
      dayEntries.forEach(e=>{
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML = `
          <div class="left">
            <span class="cat">${e.category}</span>
            ${e.note ? `<span class="note">${escapeHtml(e.note)}</span>` : ''}
          </div>
          <div class="right">
            <span class="amt ${e.type}">${e.type==='income'?'+':'-'}${rupiah(e.amount)}</span>
            <button class="del-btn" data-id="${e.id}" title="Hapus">✕</button>
          </div>`;
        groupDiv.appendChild(row);
      });
      listWrap.appendChild(groupDiv);
    });
  }

  listWrap.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      entries = entries.filter(e=>e.id !== id);
      await saveEntries();
      render();
    });
  });

  // breakdown pengeluaran per kategori (untuk periode aktif)
  const expByCat = {};
  filtered.filter(e=>e.type==='expense').forEach(e=>{
    expByCat[e.category] = (expByCat[e.category]||0) + e.amount;
  });
  const bwrap = document.getElementById('breakdownWrap');
  const bdiv = document.getElementById('breakdown');
  const catEntries = Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length === 0){
    bwrap.style.display = 'none';
    bwrap.dataset.hasData = '0';
  } else {
    bwrap.style.display = 'block';
    bwrap.dataset.hasData = '1';
    const max = catEntries[0][1];
    bdiv.innerHTML = catEntries.map(([cat, amt])=>`
      <div class="bar-row">
        <div class="bar-label"><span>${cat}</span><span>${rupiah(amt)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(amt/max*100).toFixed(1)}%"></div></div>
      </div>
    `).join('');
  }
}

const MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function renderHistory(){
  const wrap = document.getElementById('historyWrap');
  if(entries.length === 0){
    wrap.innerHTML = '<div class="empty">Belum ada data untuk direkap. Mulai catat dulu ya.</div>';
    return;
  }
  const byMonth = {};
  entries.forEach(e=>{
    const ym = e.date.slice(0,7);
    if(!byMonth[ym]) byMonth[ym] = { in:0, out:0, count:0 };
    byMonth[ym].count++;
    if(e.type === 'income') byMonth[ym].in += e.amount; else byMonth[ym].out += e.amount;
  });
  const months = Object.keys(byMonth).sort().reverse();

  wrap.innerHTML = `<div class="day-head" style="border-bottom:1px solid var(--paper-line); margin-bottom:2px;"><span>Bulan</span><span>Saldo</span></div>` +
    months.map(ym=>{
      const [y, m] = ym.split('-');
      const label = MONTH_NAMES_ID[parseInt(m,10)-1] + ' ' + y;
      const d = byMonth[ym];
      const bal = d.in - d.out;
      return `
        <div class="hist-row" data-ym="${ym}">
          <div>
            <div class="hm">${label}</div>
            <div class="hcount">${d.count} catatan</div>
          </div>
          <div class="hvals">
            <div class="hin">+${rupiah(d.in)}</div>
            <div class="hout">-${rupiah(d.out)}</div>
            <div class="hbal">${rupiah(bal)}</div>
          </div>
        </div>`;
    }).join('');

  wrap.querySelectorAll('.hist-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      selectedMonth = row.dataset.ym;
      document.getElementById('monthSelect').value = selectedMonth;
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelector('.tab[data-period="month"]').classList.add('active');
      currentPeriod = 'month';
      document.getElementById('monthPicker').style.display = 'block';
      document.getElementById('listWrap').style.display = 'block';
      document.getElementById('historyWrap').style.display = 'none';
      document.querySelector('.summary').style.display = 'grid';
      render();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('entryForm').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const amount = parseFloat(document.getElementById('amount').value);
  const date = document.getElementById('date').value;
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  if(!amount || amount <= 0 || !date) return;

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    type: currentType,
    amount, date, category, note,
    createdAt: Date.now()
  };
  entries.push(entry);
  await saveEntries();

  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  document.getElementById('date').value = todayStr();

  render();
});

(async function init(){
  setTitleDate();
  populateCategories();
  const listWrap = document.getElementById('listWrap');
  listWrap.innerHTML = '<div class="empty">Memuat catatan...</div>';
  await loadEntries();
  render();
})();
</script>
</body>
</html>
